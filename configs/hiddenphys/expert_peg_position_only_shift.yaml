# Position-only controller on peg_in_hole_hard_ood (hole noise sigma 25 mm instead of 15 mm), the position-only cell of
# the distribution-shift column. Same script and budget as expert_peg_position_only.yaml; test seeds 9100-9149 (the table
# uses the first 20). No API key.
#   python scripts/run_matrix.py --matrix configs/hiddenphys/expert_peg_position_only_shift.yaml --agent scripted --workers 8
run_name: expert_peg_position_only_shift
n_episodes: 50
seed_base: 9100
cells:
  - {task: peg_in_hole_hard_ood, model: {name: scripted_pos_only, policy: pos_only_peg}, fmt: none, vision: false, interface: pose}
episode:
  max_turns: 500
  max_tool_calls: 1200
  max_sim_time: 300.0
  kp: 150.0
  scene_noise_pos: 0.004
  scene_noise_yaw_deg: 2.0
  f_contact: 3.0
  f_cap: 25.0
  force_sign: -1.0
  force_noise_std: 0.5
  force_bias_std: 0.3
  proprio: minimal
