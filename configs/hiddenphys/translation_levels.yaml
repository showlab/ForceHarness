# Translation levels (an extra run that the paper does not report): the four levels of the physics translation layer (phys1-phys4) against derived signals
# (signals) and the no-force control (none|pose), on the two decision tasks (weight_sort, com_sort), with five GPT-5.x
# models (chat completions, reasoning off). No images; proprio minimal (tool results give no durations, simulated time
# or finger opening while closed, which would leak the load); classes balanced by seed.
# 60 cells x 8 episodes = 480 episodes on seeds 5000-5007, about US$20-30 at list price.
#   python scripts/run_matrix.py --matrix configs/hiddenphys/translation_levels.yaml --workers 6
