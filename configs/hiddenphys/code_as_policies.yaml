# Code-as-Policies harness baseline (forceharness/baselines/code_as_policies.py), one model call per episode. The system
# prompt holds the program interface, the robot API of the episode's interface (signatures and descriptions from the
# tool schemas in forceharness/agent/tools.py) and the fields every call returns; the user message holds the
# instruction and the initial noisy scene, as in a tool-calling episode. The model replies with one Python program, which
# runs in-process without further model calls; the wrapper enforces the call and simulated-time budgets.
#   cap|pose  = classic Code-as-Policies: position and grasp primitives only (plus the task's point_tool / turn), kinematic
#               results only (reworded by the same rules as the none|pose control).
#   cap|force = the same executor with our force primitives and the force fields in the results (a program written once).
# max_tokens is 16384 to leave room for the program plus low-effort reasoning (4096 can truncate it). The fmt slot carries
# the harness name, so the conditions are named cap|pose and cap|force. GPT-6 Astra, Responses API, reasoning effort low.
# Test seeds 9100-9104 (n = 5 per cell, as in the paper; set n_episodes to 20 to match the main table and rerun: runs
# resume). Episode settings as in expert.yaml; lock_or_stiff with the soft arm (the episode kp applies to every task).
# Paid API calls: about US$0.07 per episode, US$5 for the 70 episodes.
#   python scripts/run_matrix.py --matrix configs/hiddenphys/code_as_policies.yaml --dry-run
#   python scripts/run_matrix.py --matrix configs/hiddenphys/code_as_policies.yaml --workers 6
run_name: code_as_policies
n_episodes: 5
seed_base: 9100
cells:
- task: weight_sort
  model: &astra_cap
    name: gpt-6-astra
    provider: openai-responses
    api_key_env: FH_API_KEY
    reasoning_effort: low
    max_tokens: 16384
    harness: cap
  fmt: cap
  vision: false
  interface: pose
- task: weight_sort
  model: *astra_cap
  fmt: cap
  vision: false
  interface: force
- task: com_sort
  model: *astra_cap
  fmt: cap
  vision: false
  interface: pose
- task: com_sort
  model: *astra_cap
  fmt: cap
  vision: false
  interface: force
- task: wipe_hard
  model: *astra_cap
  fmt: cap
  vision: false
  interface: pose
- task: wipe_hard
  model: *astra_cap
  fmt: cap
  vision: false
  interface: force
- task: stack_gentle
  model: *astra_cap
  fmt: cap
  vision: false
  interface: pose
- task: stack_gentle
  model: *astra_cap
  fmt: cap
  vision: false
  interface: force
- task: peg_in_hole_hard
  model: *astra_cap
  fmt: cap
  vision: false
  interface: pose
- task: peg_in_hole_hard
  model: *astra_cap
  fmt: cap
  vision: false
  interface: force
- task: door_latch
  model: *astra_cap
  fmt: cap
  vision: false
  interface: pose
- task: door_latch
  model: *astra_cap
  fmt: cap
  vision: false
  interface: force
- task: lock_or_stiff
  model: *astra_cap
  fmt: cap
  vision: false
  interface: pose
- task: lock_or_stiff
  model: *astra_cap
  fmt: cap
  vision: false
  interface: force
episode:
  max_turns: 40
  max_tool_calls: 80
  max_sim_time: 300.0
  kp: 150.0
  scene_noise_pos: 0.004
  scene_noise_yaw_deg: 2.0
  f_contact: 3.0
  f_cap: 25.0
  force_sign: -1.0
  force_noise_std: 0.5
  force_bias_std: 0.3
  proprio: minimal
