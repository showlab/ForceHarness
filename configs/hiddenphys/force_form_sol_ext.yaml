# Form-of-force ablation, GPT-6.1 Sol: the none (no-force control) and phys2 (L2) cells on seeds 9105-9109, which together
# with seeds 9100-9104 from forceharness_other_models.yaml make 10 episodes per cell. Settings as in force_form_sol.yaml.
#   python scripts/run_matrix.py --matrix configs/hiddenphys/force_form_sol_ext.yaml --workers 6
run_name: force_form_sol_ext
n_episodes: 5
seed_base: 9105
cells:
  - {task: weight_sort, model: &m {name: gpt-6.1-sol, provider: openai-responses, api_key_env: FH_API_KEY, reasoning_effort: low}, fmt: none, vision: false, interface: pose}
  - {task: com_sort, model: *m, fmt: none, vision: false, interface: pose}
  - {task: wipe_hard, model: *m, fmt: none, vision: false, interface: pose}
  - {task: stack_gentle, model: *m, fmt: none, vision: false, interface: pose}
  - {task: peg_in_hole_hard, model: *m, fmt: none, vision: false, interface: pose}
  - {task: door_latch, model: *m, fmt: none, vision: false, interface: pose}
  - {task: lock_or_stiff, model: *m, fmt: none, vision: false, interface: pose}
  - {task: weight_sort, model: *m, fmt: phys2, vision: false, interface: force}
  - {task: com_sort, model: *m, fmt: phys2, vision: false, interface: force}
  - {task: wipe_hard, model: *m, fmt: phys2, vision: false, interface: force}
  - {task: stack_gentle, model: *m, fmt: phys2, vision: false, interface: force}
  - {task: peg_in_hole_hard, model: *m, fmt: phys2, vision: false, interface: force}
  - {task: door_latch, model: *m, fmt: phys2, vision: false, interface: force}
  - {task: lock_or_stiff, model: *m, fmt: phys2, vision: false, interface: force}
episode:
  max_turns: 40
  max_tool_calls: 80
  max_sim_time: 300.0
  kp: 150.0
  scene_noise_pos: 0.004
  scene_noise_yaw_deg: 2.0
  f_contact: 3.0
  f_cap: 25.0
  force_sign: -1.0
  force_noise_std: 0.5
  force_bias_std: 0.3
  proprio: minimal
