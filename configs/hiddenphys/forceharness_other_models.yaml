    model: &m0 {name: gpt-6.1-sol, provider: openai-responses, api_key_env: FH_API_KEY, reasoning_effort: low}
    fmt: none
    vision: false
    interface: pose
  - {task: weight_sort, model: *m0, fmt: phys2, vision: false, interface: force}
