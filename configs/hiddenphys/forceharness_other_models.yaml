# The two main rows (phys2|force = ForceHarness, none|pose = the no-force control) for seven more OpenAI models, 5 episodes
# per cell on test seeds 9100-9104: GPT-6.1 Sol through the Responses API (reasoning effort low), and the GPT-5.x models
# through chat completions with reasoning off (reasoning_effort none, as needed when tools are in use). Same protocol as
# forceharness_astra.yaml (no images, 40 turns / 80 tool calls / 300 s, lock_or_stiff with the soft arm).
# The none and phys2 cells of the form-of-force table for seeds 9100-9104 come from this run.
# Paid API calls: about US$25 for the 490 episodes (list price); gpt-5.4-nano is missing from the price table, so its cost
# is estimated with the gpt-5.4 price and overstated.
#   python scripts/run_matrix.py --matrix configs/hiddenphys/forceharness_other_models.yaml --workers 6
run_name: forceharness_other_models
n_episodes: 5
seed_base: 9100
